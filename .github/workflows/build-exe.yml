name: 💻 Build EXE on Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 🧬 Checkout Code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🔨 Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile Madmen_AutoLogin_v4.py

      - name: 📤 Upload Compiled EXE
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Madmen_Login_Hack_EXE                      # Artifact name in GitHub UI
          path: dist/Madmen_AutoLogin_v4.exe               # Built executable path
          if-no-files-found: error                         # Fail if EXE missing
          retention-days: 30                               # Keep artifact for 30 days
          compression-level: 6                             # Balanced speed/size
          overwrite: true                                  # Replace if already exists
          include-hidden-files: false                      # Skip dotfiles and hidden junk
